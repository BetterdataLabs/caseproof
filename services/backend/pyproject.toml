[project]
name = "caseproof-platform"
version = "1.0.0"
description = "CaseProof: autonomous document follow-up for invoice financing (Gemini + ADK)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "google-adk==2.11.0",
  "google-genai>=2.19,<3",
  "google-auth>=2.35",
  "google-cloud-storage>=2.18",
  "google-cloud-tasks>=2.17",
  "pypdfium2>=4.30",
  "reportlab>=4.2",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "pillow>=10.4",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-timeout>=2.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
extend = "../../ruff.toml"
