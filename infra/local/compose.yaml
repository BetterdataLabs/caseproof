name: caseproof
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cp_owner
      POSTGRES_PASSWORD: cp_owner_local
      POSTGRES_DB: caseproof
    ports:
      - "127.0.0.1:56542:5432"
    volumes:
      - caseproof-db:/var/lib/postgresql/data
      - ./init-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cp_owner -d caseproof"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  caseproof-db:
